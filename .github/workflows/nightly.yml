name: nightly-comparison

on:
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run the comparison
        run: uv run python -m eval.run
        env:
          SILLWARD_MODE_OVERLAY: '{"tool.approval":"active","turn.continue":"active"}'
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Archive the report and the acceptance record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-comparison
          path: |
            eval/reports/
            eval/acceptance/
          if-no-files-found: ignore
